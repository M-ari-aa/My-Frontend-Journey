<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 500px;
            height: 300px;
            background-color: green;
            position: relative;
            top: 100px;
            left: 100px;

        }
        .sub{
            width: 300px;
            height: 100px;
            background-color: greenyellow;
            position: absolute;
            top: 50px;
            left: 50px;
            text-align: center;
            color: brown;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="sub">absolute</div>
    </div>
    
</body>
</html>
