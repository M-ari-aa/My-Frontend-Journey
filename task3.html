<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <label for="name">Name</label>
    <input type="text" name="name" id="name" placeholder="enter your name"> <br>

    <label for="email">Email</label>
    <input type="email" name="email" id="email" placeholder="enter your email"> <br>

    <label for="phno">Phno</label>
    <input type="tel" name="phno" id="phno" placeholder="enter your number"> <br>

    <label for="password">Password</label>
    <input type="password" name="password" id="password" placeholder="enter the password"> <br>

    <label for="gender">Gender</label>
    <input type="radio" name="gender" id="male">
    <label for="gender">male</label>
    <input type="radio" name="gender" id="female">
    <label for="gender">female</label> <br>

    <label for="course">Course</label>
    <input type="checkbox" name="html" id="html">
    <label for="html">HTML</label>
    <input type="checkbox" name="java" id="java">
    <label for="java">JAVA</label>
    <input type="checkbox" name="uiux" id="uiux">
    <label for="uiux">UIUX</label> <br>

    <label for="dob">DOB</label>
    <input type="date" name="dob" id="dob"> <br>

    <button>submit</button>
    <button>reset</button>


    
</body>
</html>
