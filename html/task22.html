<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball{
            width: 100px;
            height: 100px;
            border-radius: 100px;
            background-color: red;
            animation-name: move;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            position: relative;
        }
        @keyframes move {
            0%{
                top: 0px;
            }
            50%{
                top: 300px;
            }
            100%{
                top: 0px;
            }
            
        }
    </style>
</head>
<body>
    <div class="ball"></div>
    
</body>
</html>
