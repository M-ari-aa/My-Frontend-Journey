<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100px;
            height: 100px;
            background-color: black;
            position: relative;
            animation: box  2s infinite;
        }
        @keyframes box {
            0%{
                left: 0;
                top: 0;
                background-color: black;
            }
            25%{
                left: 400px;
                top: 0;
                background-color: aqua;
            }
            50%{
                left: 400px;
                top: 400px;
                background-color: aquamarine;
            }
            75%{
                left: 0;
                top: 400px;
                background-color: cadetblue;
            }
            100%{
                left: 0;
                top: 0;
                background-color: black;
            }
            
        }
    </style>
</head>
<body>
    <div class="main"></div>
    
</body>
</html>
