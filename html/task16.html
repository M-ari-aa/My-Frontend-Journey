<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .main{
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            
        }
        .head{
            color: rgb(58, 162, 128);
            font-size: 30px;
            display: flex;
        }
        .nav{
            display: flex;
            gap: 10px;
            text-align: center;
            cursor: pointer;
        }
        .body{
            background-image: url(https://images.unsplash.com/photo-1507525428034-b723cf961d3e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8YmVhY2glMjB3YWxscGFwZXJ8ZW58MHx8MHx8fDA%3D);
            background-size: cover;
            background-position: center;
            width: 1526px;
            height: 730px;
            
        }
       .content{
        color: white;
        text-align: center;
        padding: 50px;
       }
       h1{
        margin-top: 200px;
        align-items: center;
        font-size: 50px;
       }
       h3{
        margin-top: 20px;
       }
       .green{
        background-color: rgb(17, 197, 137);
        color: white;
        height: 30px;
        border: 1px solid aquamarine;
        margin-top: 20px;
        cursor: pointer;
        padding: 5px;
       }
       .white{
        color: white;
        background-color: transparent;
        height: 30px;
        border: 1px solid white;
        margin-top: 20px;
        cursor: pointer;
        padding: 5px;
       }

    </style>
</head>
<body>
    <div class="main">
        <div class="head">Wanderlust</div>
        <div class="nav">
            <p>Home</p>
            <p>Destination</p>
            <p>Tours</p>
            <p>Packages</p>
            <p>Blog</p>
            <p>Contact</p>
        </div>  
    </div>
    <div class="body">
        
        <div class="content">
        <h1>DISCOVER THE WORLD'S BEAUTY</h1>
        <h3>Explore the unique destinations and create unforgettable memories with our travel experiences.</h3>
        
        <button class="green">Explore Tours</button>
       
        <button class="white">Load More</button>
        </div>
    </div>
    
</body>
</html>
