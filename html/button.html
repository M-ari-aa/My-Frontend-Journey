<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: blue;
            color: white;
            height: 40px;
            cursor: pointer;
        }
        
        button:hover{
            background-color: blueviolet;
            
            border-radius: 50px;
            color: brown;
        }

    </style>
</head>
<body>
    <button>click me</button>
</body>
</html>
