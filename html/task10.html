<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .main{
            background-color: black;
            color: white;
            width: 90px auto;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo{
            color: white;
            font-size: 20px;
            
        }
        .search{
            display: flex;
        }
    
        .links{
            display: flex;
            gap: 20px;                                
            
        }
        .nav{
            width: 300px;
        }
        
    </style>
</head>
<body>
    <div class="main">
        <div class="logo">TIMELESS WATCHES</div>
        <div class="search">
            <input type="text" class ="nav" placeholder="Search...">
        </div>
        <div class="links">
            <p>Shop</p>
            <p>New Arrivals</p>
            <p>Brand</p>
            <p>About</p>
            <p>Contact</p>
        </div>
    </div>
</body>
</html>
