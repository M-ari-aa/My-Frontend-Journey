<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100px;
            height: 100px;
            background-color: blue;
            animation: box 2s infinite;
        }
        @keyframes box {
            0%{
                width: 100px;
                height: 100px;
                background-color: blue;

            }
            50%{
                width: 150px;
                height: 150px;
                background-color: blueviolet;
            }
            100%{
                width: 200px;
                height: 200px;
                background-color: purple;
            }
            
        }
    </style>
</head>
<body>
    <div class="main"></div>
    
</body>
</html>
