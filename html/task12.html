<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .main{
            background-color: black;
            color: white;
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            
        }
        .logo{
            color: white;
            font-weight: bold;
            font-size: 24px;
             font-family: "Open Sans", sans-serif;
        }
        .nav{
            display: flex;
            gap: 20px;
            cursor: pointer;
        }
        .nav :hover{
            color: blueviolet;
        }
        .icons{
            display: flex;
            gap: 20px;
            cursor: pointer;
        }
        .icons i:hover{
            color: gold;
        }
        
    </style>
</head>
<body>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    
    <div class="main">
        <div class="logo">TechZone</div>
        <div class="nav">
            <p>Home</p>
            <P>About</P>
            <P>services</P>
            <p>Contact</p>
        </div>
        <div class="icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-user"></i>
            <i class="fa-solid fa-cart-shopping"></i>

        </div>
    </div>
    
</body>
</html>
