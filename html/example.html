<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 800px;
            height: 800px;
            background-color: green;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;

        }
        .sub{
            width: 50px;
            height:50px;
           
        }
        .d1{
            background-color: yellow;
        }
        .d2{
            background-color: blue;
        }
        .d3{
            background-color: violet;
        }
        .d4{
            background-color: aqua;
        }
        .d5{
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="sub d1"></div>
          <div class="sub d2"></div>
            <div class="sub d3"></div>
              <div class="sub d4"></div>
                 <div class="sub d5"></div>
    </div>
    
</body>
</html>
