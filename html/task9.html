<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .links{
            background-color: black;
            color: white;
            width: 90%;
            padding: 15px 40px;
            margin: 50px auto;
            display: flex;
            justify-content: space-between; 
            align-items: center;   
            box-shadow: 0 4px 10px;

        }
        .main{
            
            display: flex;
            gap: 30px;
            color: white;
            align-items: center;     
            cursor: pointer;    
        }
        button{
            background-color: blue;
            color: white;
            height: 30px;
            border-radius: 60px;
            cursor: pointer;  
              
            
        }
        button:hover{
            background-color: blueviolet;
        }
        .sub{
            font-size: 24px;
            color: white;
            font-weight: bold;

        }

    </style>
</head>
<body>
    <div class="links">
        <div class="main">
        <p>Services</p>
        <p>Projects</p>
        <p>About</p>
        <button>contact</button>
    </div>
        <div class="sub">
            LOGOBAKERY
        </div>
    </div>
</body>
</html>
